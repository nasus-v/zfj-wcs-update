#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # =========================================================
    # WMS 后端
    # =========================================================
    upstream wms_backend {
        server 127.0.0.1:8008;
        keepalive 32;
    }

    # =========================================================
    # WCS 后端
    # =========================================================
    upstream wcs_backend {
        server 127.0.0.1:8007;
        keepalive 32;
    }


    # =========================================================
    # HTTP 80
    # 所有 HTTP 请求自动跳转 HTTPS
    # =========================================================
    server {
        listen       80;
        server_name  smswms.seagate.com;

        return 301 https://$host$request_uri;
    }


    # =========================================================
    # HTTPS 443
    # =========================================================
    server {
        listen       443 ssl;
        server_name  smswms.seagate.com;

        # =====================================================
        # HTTPS 证书
        # 修改成你自己的实际证书路径
        # =====================================================
        ssl_certificate      D:/soft/nginx-1.27.4/cert/woopiwhmw01b.seagate.com.cer;
        ssl_certificate_key   D:/soft/nginx-1.27.4/cert/woopiwhmw01b.seagate.com.key;

        # =====================================================
        # SSL 基础配置
        # =====================================================
        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # =====================================================
        # 根目录
        # https://smswms.seagate.com
        #
        # 自动跳到
        # https://smswms.seagate.com/wms/
        # =====================================================
        location = / {
            return 301 /wms/;
        }


        # =====================================================
        # WMS
        # =====================================================

        # /wms -> /wms/
        location = /wms {
            return 301 /wms/;
        }

        # WMS 前端
        location /wms/ {
            alias D:/project/wms/web/dist/;

            index index.html index.htm;

            try_files $uri $uri/ /wms/index.html;
        }


        # =====================================================
        # WMS 后端接口
        #
        # 浏览器访问：
        # https://smswms.seagate.com/wms_api/xxx
        #
        # 实际转发：
        # http://127.0.0.1:8008/wms/xxx
        # =====================================================
        location /wms_api/ {

            proxy_pass http://wms_backend/wms/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 因为外部已经是 HTTPS
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }


        # 兼容没有 / 的请求
        location = /wms_api {
            return 301 /wms_api/;
        }



        # =====================================================
        # WCS
        # =====================================================

        # /wcs -> /wcs/
        location = /wcs {
            return 301 /wcs/;
        }


        # =====================================================
        # WCS static 静态资源
        #
        # 你现在的 WCS 前端如果生成的是：
        # /static/xxx
        #
        # 就保留这里
        # =====================================================
        location /static/ {
            alias D:/project/wcs/web/dist/static/;
        }


        # WCS 前端
        location /wcs/ {
            alias D:/project/wcs/web/dist/;

            index index.html index.htm;

            try_files $uri $uri/ /wcs/index.html;
        }


        # =====================================================
        # WCS 后端接口
        #
        # 浏览器访问：
        # https://smswms.seagate.com/prod_api/xxx
        #
        # 实际转发：
        # http://127.0.0.1:8007/wcs/xxx
        # =====================================================
        location /prod_api/ {

            proxy_pass http://wcs_backend/wcs/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 外部是 HTTPS
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }


        # 兼容没有 / 的请求
        location = /prod_api {
            return 301 /prod_api/;
        }



        # =====================================================
        # 错误页面
        # =====================================================
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root html;
        }
    }
}